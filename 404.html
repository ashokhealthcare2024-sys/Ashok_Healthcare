<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | Ashok Healthcare</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, sans-serif;
      color: #172033;
      background: #f5f7fb;
    }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
    }
    main {
      width: min(100%, 560px);
      padding: 40px;
      box-sizing: border-box;
      text-align: center;
      background: #fff;
      border: 1px solid #e3e8f0;
      border-radius: 16px;
      box-shadow: 0 12px 36px rgba(23, 32, 51, .08);
    }
    h1 { margin: 0 0 12px; font-size: 2rem; }
    p { margin: 0 0 24px; color: #586579; line-height: 1.6; }
    a {
      display: inline-block;
      padding: 12px 20px;
      border-radius: 999px;
      color: #fff;
      background: #1769d2;
      font-weight: 700;
      text-decoration: none;
    }
    a:focus-visible { outline: 3px solid #172033; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>Page not found</h1>
    <p>The page may have moved or is no longer available. Return to Ashok Healthcare to find the care or information you need.</p>
    <a href="/index.html">Go to homepage</a>
  </main>
</body>
</html>
