---
deployment:
  tasks:
    # --------------------------------------------------------------------------
    # ASHOK HOME HEALTHCARE SERVICES - CPANEL GIT DEPLOYMENT CONFIGURATION
    # --------------------------------------------------------------------------
    # NOTE:
    # Replace 'username' with your actual cPanel username.
    # - Primary domain: /home/username/public_html
    # - Subdomain / Addon domain: /home/username/yourdomain.com
    # --------------------------------------------------------------------------
    - export DEPLOYPATH=/home/username/public_html
    - if [ "$DEPLOYPATH" = "/home/username/public_html" ] && [ -n "$USER" ] && [ -d "/home/$USER/public_html" ]; then export DEPLOYPATH="/home/$USER/public_html"; fi
    - /bin/mkdir -p $DEPLOYPATH

    # 1. Deploy Root HTML Pages
    - /bin/cp -f index.html $DEPLOYPATH/
    - /bin/cp -f about.html $DEPLOYPATH/
    - /bin/cp -f services.html $DEPLOYPATH/
    - /bin/cp -f products.html $DEPLOYPATH/
    - /bin/cp -f gallery.html $DEPLOYPATH/
    - /bin/cp -f careers.html $DEPLOYPATH/
    - /bin/cp -f blog.html $DEPLOYPATH/
    - /bin/cp -f contact.html $DEPLOYPATH/
    - /bin/cp -f privacy.html $DEPLOYPATH/
    - /bin/cp -f terms.html $DEPLOYPATH/
    - /bin/cp -f 404.html $DEPLOYPATH/

    # 2. Deploy Root Assets, Icons & SEO Metadata
    - /bin/cp -f favicon.svg $DEPLOYPATH/
    - /bin/cp -f icons.svg $DEPLOYPATH/
    - /bin/cp -f sitemap.xml $DEPLOYPATH/
    - /bin/cp -f robots.txt $DEPLOYPATH/
    - /bin/cp -f google365c6c761a442363.html $DEPLOYPATH/
    - /bin/cp -f .htaccess $DEPLOYPATH/ 2>/dev/null || true

    # 3. Deploy Media, Components & Asset Directories Recursively
    - /bin/cp -R -f assets $DEPLOYPATH/
    - /bin/cp -R -f components $DEPLOYPATH/
    - /bin/cp -R -f Gallery $DEPLOYPATH/
    - /bin/cp -R -f images $DEPLOYPATH/
    - /bin/cp -R -f Bg_Banner $DEPLOYPATH/
    - /bin/cp -R -f services $DEPLOYPATH/
    - /bin/cp -R -f blog $DEPLOYPATH/
